[project]
name = "djc-to-citry"
version = "0.1.0"
description = "Migrate django-components libraries to citry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
keywords = ["django-components", "citry", "migration", "codemod"]
dependencies = [
    "django-components",
    "django>=5.2",
    "citry>=0.5.0",
    "libcst>=1.4",
]
authors = [{ name = "Joey Jurjens", email = "joeyjurjens@gmail.com" }]

[project.optional-dependencies]
compat = ["citry-django[django-components]>=0.1"]

[project.scripts]
djc-to-citry = "djc_to_citry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djc_to_citry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "citry-django[django-components]"]

[tool.ty.environment]
python = ".venv"
